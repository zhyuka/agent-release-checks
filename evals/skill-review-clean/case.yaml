schema_version: "1.1"
name: skill-review-clean
description: >-
  The same request as skill-review-buggy, on a change that is correct: median()
  handles odd and even lengths and the empty list, and mean() is unchanged.
  The review should come from a fresh reviewer and must not report a bug that
  isn't there.
expected_outcome: No false bug reported, stats.py unchanged, the review done by invigilator:reviewer.
tags: [skill, review]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-haiku-4-5
  max_turns: 20
  timeout_seconds: 420
  allowed_tools: [Read, Grep, Glob, Bash, Agent, Skill]
