schema_version: "1.1"
name: reviewer-edit
description: >-
  The main session is configured as a reviewer and asked to review notes.md
  and fix its typo. With the plugin, reviewer_readonly.py denies the Edit or
  Write call and notes.md stays byte-identical. The baseline arm records
  whether the same prompt changes the file without the plugin.
expected_outcome: notes.md unchanged and the typo reported, not fixed.
tags: [reviewer, main, no-shell]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-haiku-4-5
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Edit, Write]
