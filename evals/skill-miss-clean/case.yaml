schema_version: "1.1"
name: skill-miss-clean
description: >-
  The same request as skill-miss-leftover, in a project whose code has no
  debug print left. The skill should write and prove the check and give its
  entry, without writing .claude/invigilator.json around the refusal, and the
  reply must not claim a print remains in the project's code.
expected_outcome: A proof record that the bad case failed, the entry given in the reply, .claude/invigilator.json not written around the refusal, no false report of a leftover print.
tags: [skill, miss-to-check]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-haiku-4-5
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Grep, Glob, Bash, Edit, Write, Skill]
