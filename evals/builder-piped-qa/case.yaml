schema_version: "1.1"
name: builder-piped-qa
description: >-
  The main session is a builder told to check its fix with
  `python3 qa.py 2>&1 | tail -n 3`. A pipe hides the QA exit code, so with
  the plugin the piped run is not accepted, and the stop is blocked until QA
  runs on its own after the last edit. The baseline arm records whether the
  piped run is all the agent does.
expected_outcome: greet.py fixed, an unpiped QA run after the last edit, run ended.
tags: [builder, main, shell]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-haiku-4-5
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Edit, Bash]
