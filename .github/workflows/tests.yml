name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # setup-python has no Python 3.9 build for Ubuntu 26.04, so pin the 3.9 job
    # to ubuntu-24.04 when ubuntu-latest moves.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # tests/test_launcher.py runs every hook command in hooks/hooks.json, fed
      # every fixture, from a plugin folder whose path has spaces, in each shell
      # Claude Code can use: sh, dash and bash on macOS and Linux, Git Bash on
      # Windows, and PowerShell (pwsh, and Windows PowerShell 5.1) for Windows
      # without Git Bash. REQUIRE_SHELLS makes a missing shell a failure.
      - name: Unit tests, with every hook command run in every shell
        env:
          REQUIRE_SHELLS: ${{ runner.os == 'Windows' && 'git-bash,pwsh,powershell' || 'sh,dash,bash,pwsh' }}
        run: python -m unittest discover -s tests -v

      - name: Demo
        run: python -m invigilator demo

      - name: Install and check the example runs
        run: |
          python -m pip install .
          invigilator check examples/runs/qa-builder
          invigilator check examples/runs/reviewer-read-only
          if invigilator check examples/runs/cheap-builder; then exit 1; fi
          if invigilator check examples/runs/reviewer-wrote; then exit 1; fi

      # The same hook command typed into a real bash and a real pwsh, from a path
      # with spaces, as a reader of this log would run it.
      - name: A reviewer's write is denied (bash)
        run: |
          root="$RUNNER_TEMP/plugin root with spaces"
          mkdir -p "$root" && cp -R hooks invigilator tests "$root/"
          command=$(python -c 'import json; print(json.load(open("hooks/hooks.json"))["hooks"]["PreToolUse"][0]["hooks"][0]["command"])')
          root_slashes=$(python -c 'import pathlib, sys; print(pathlib.Path(sys.argv[1]).as_posix())' "$root")
          cd "$root"
          answer=$(CLAUDE_PLUGIN_ROOT="$root_slashes" sh -c "${command//\$\{CLAUDE_PLUGIN_ROOT\}/$root_slashes}" < tests/fixtures/hooks/deny-reviewer-write.json)
          echo "$answer"
          case $answer in *'"permissionDecision": "deny"'*) ;; *) exit 1 ;; esac

      - name: A reviewer's write is denied (pwsh, as on Windows without Git Bash)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'pwsh plugin root with spaces'
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item -Recurse hooks, invigilator, tests -Destination $root
          $command = (Get-Content -Raw hooks/hooks.json | ConvertFrom-Json).hooks.PreToolUse[0].hooks[0].command
          $command = $command.Replace('${CLAUDE_PLUGIN_ROOT}', '${env:CLAUDE_PLUGIN_ROOT}')
          $env:CLAUDE_PLUGIN_ROOT = $root.Replace('\', '/')
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($command))
          Set-Location $root
          $answer = Get-Content -Raw tests/fixtures/hooks/deny-reviewer-write.json | pwsh -NoProfile -NonInteractive -EncodedCommand $encoded
          $answer
          if (-not ($answer -match '"permissionDecision": "deny"')) { exit 1 }

  validate:
    # Claude Code installs from npm without signing in, and plugin validate
    # reads local files only.
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace and the plugin
        run: |
          claude --version
          claude plugin validate --strict .
          # Before Claude Code 2.1.289, validating the repo root checks only the
          # marketplace. A copy without marketplace.json checks the plugin's
          # manifest, hooks and skills on any version.
          plugin="$RUNNER_TEMP/plugin"
          mkdir -p "$plugin"
          cp -R .claude-plugin hooks skills README.md "$plugin/"
          rm "$plugin/.claude-plugin/marketplace.json"
          claude plugin validate --strict "$plugin"
