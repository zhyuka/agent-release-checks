name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest is Ubuntu 24.04. setup-python has no Python 3.9 build for
    # Ubuntu 26.04, so pin the 3.9 job to ubuntu-24.04 when ubuntu-latest moves.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo
        run: python -m release_checks demo
      - name: Install and check the example runs
        run: |
          python -m pip install .
          release-checks check examples/runs/qa-builder
          release-checks check examples/runs/reviewer-read-only
          if release-checks check examples/runs/cheap-builder; then exit 1; fi
          if release-checks check examples/runs/reviewer-wrote; then exit 1; fi
