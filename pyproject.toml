[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invigilator"
version = "0.4.0"
description = "Checks an agent can't pass for itself: run a project's checks from a skill, a git hook or CI, each counting only once proven on a planted bad case and a good one."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Derek Zhou" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/zhyuka/invigilator"

[project.scripts]
invigilator = "invigilator.cli:main"

[tool.setuptools]
packages = ["invigilator"]
