[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invigilator"
version = "0.3.5"
description = "Release checks for agent-built software: refuse vacuous scores, keep reviewers read-only, and require proof that QA ran."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Derek Zhou" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/zhyuka/invigilator"

[project.scripts]
invigilator = "invigilator.cli:main"

[tool.setuptools]
packages = ["invigilator"]
